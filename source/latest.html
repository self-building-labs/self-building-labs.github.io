<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quantum dot experiments — interactive workflow</title><link rel="stylesheet" href="style.css"><style>body{background:#fff}.viewer-shell{border:0;box-shadow:none}.viewport{height:570px}.viewer-caption{padding:0 16px}.latest-stages{grid-template-columns:1fr 1fr}@media(max-width:600px){.viewport{height:480px}.viewer-title strong{font-size:13px}.follow-control{margin-right:8px}.viewer-toolbar{padding:0 10px}.camera-controls{left:10px;top:10px}.camera-controls button{padding:6px 8px}}</style><script type="module" src="latest-app.js"></script></head><body><svg class="symbol-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>

<div class="viewport" id="viewport"><img class="viewer-poster" src="assets/latest-poster.jpg" alt="Reconstructed laboratory for quantum dot experiments" loading="lazy"><div class="viewer-launch" id="viewer-launch"><span class="loading-orbit" aria-hidden="true"></span><small id="loading-status" role="status">Preparing the interactive laboratory…</small><button class="primary-button" id="load-viewer" hidden>Retry 3D view</button></div><div class="viewport-label sr-only" id="viewport-label" hidden><span class="status-dot"></span><span id="camera-label">Full laboratory</span></div><div class="camera-controls" hidden><button data-camera="overview" class="active" aria-pressed="true">Full lab</button><button data-camera="ot2" aria-pressed="false">Opentrons</button><button data-camera="xarm" aria-pressed="false">xArm</button><button id="reset-camera" class="icon-button" aria-label="Reset camera"><svg><use href="#i-reset"/></svg></button></div><span class="orbit-hint sr-only" hidden>Drag to orbit · Scroll to zoom · Right-drag to pan</span></div>
